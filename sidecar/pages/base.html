<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}骰娘后台{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --fg: #1f1e1c; --muted: #6b6862; --line: #e2dfd8;
    --accent: #6a4c93; --accent-fg: #fff; --ok: #2f7d4f; --err: #b3261e; --chip: #efeaf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --card: #222127; --fg: #ecebef; --muted: #a09da8; --line: #34323b;
      --accent: #a98be0; --accent-fg: #17161a; --ok: #6cc28f; --err: #f2867d; --chip: #2e2a38;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 960px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 4px; height: 52px; }
  .brand { font-weight: 600; margin-right: 12px; white-space: nowrap; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
  nav a.on { color: var(--fg); background: var(--chip); }
  .spacer { flex: 1; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .desc { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; font: 13px ui-monospace, Consolas, monospace; }
  textarea, input[type=text], input[type=password] {
    width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px;
  }
  textarea { min-height: 3.2em; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.link { border: none; background: none; color: var(--muted); padding: 6px 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .variant { margin-bottom: 10px; }
  .preview { font-size: 14px; color: var(--muted); white-space: pre-wrap; margin-top: 4px; padding-left: 10px; border-left: 3px solid var(--line); }
  .preview.err { color: var(--err); border-color: var(--err); }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); }
  .flash.ok { border-color: var(--ok); color: var(--ok); }
  .flash.err { border-color: var(--err); color: var(--err); }
  .scope { font-size: 13px; color: var(--muted); margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .scope:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .tag { font-size: 12px; color: var(--accent); margin-left: 6px; }
  label.field { display: block; font-weight: 600; margin-bottom: 2px; }
  .error { color: var(--err); font-size: 14px; margin-top: 4px; }
  a.btn { display: inline-block; text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 14px; }
  button.danger { color: var(--err); }
  .muted { color: var(--muted); }
  input[type=date] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  table.ledger { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.ledger th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.ledger td { padding: 6px 10px; vertical-align: middle; }
  table.ledger tr.first td { border-top: 1px solid var(--line); }
  table.ledger tr.overdue td:not(.who) { color: var(--err); }
  table.ledger tr.overdue input[type=date] { border-color: var(--err); color: var(--err); }
  .who .rename { display: flex; gap: 4px; align-items: center; }
  .who input { max-width: 140px; padding: 4px 8px; }
  .who .qq { font-size: 12px; color: var(--muted); padding-left: 2px; }
  .nowrap { flex-wrap: nowrap; }
  @media (max-width: 560px) {
    .brand { display: none; } main { padding: 12px 16px; }
    table.ledger thead { display: none; }
    table.ledger, table.ledger tbody, table.ledger tr, table.ledger td { display: block; width: 100%; }
    table.ledger td { padding: 4px 12px; }
    table.ledger td[rowspan] { padding-top: 10px; }
    table.ledger tr:not(.first) td:first-child { padding-top: 8px; }
    table.ledger tr td:last-child { padding-bottom: 10px; }
  }
</style>
</head>
<body>
{% if path != "/login" %}
<header><div class="bar">
  <span class="brand">骰娘后台</span>
  <nav>
    <a href="/texts" class="{{ 'on' if path.startswith('/texts') }}">文案</a>
    <a href="/ledger" class="{{ 'on' if path.startswith('/ledger') }}">团账本</a>
    <a href="/settings" class="{{ 'on' if path.startswith('/settings') }}">配置</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" action="/logout"><button class="link">退出</button></form>
</div></header>
{% endif %}
<main>
  {% for kind, text in flashes %}<div class="flash {{ kind }}">{{ text }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
